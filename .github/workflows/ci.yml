name: ci
on:
  push:
    branches: [main]
    # Docs-only pushes skip CI: markdown never reaches the build.
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 22 is the published floor; 24 is what real deployments run.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本的唯一真身是根 package.json 的 packageManager——action-setup v4
      # 在 workflow 里再写 version 会报 "Multiple versions of pnpm specified"。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build 必须在 typecheck 之前：cli/server/web 的类型检查解析 @kclaw/core
      # 走 core 的 dist 产物（exports 指向 dist/*.d.ts），全新 checkout 没有它。
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
