name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本的唯一真身是根 package.json 的 packageManager——action-setup v4
      # 在 workflow 里再写 version 会报 "Multiple versions of pnpm specified"。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # 场景 E 是时序敏感的端到端（issue #1），在共享 runner 上不稳定——CI 跳过，
      # 本地照常跑（不设该变量）。
      - run: pnpm test
        env:
          KCLAW_SKIP_SCENARIO_E: "1"
