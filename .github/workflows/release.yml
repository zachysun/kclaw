name: release
# Tag-driven release: consistency checks, full build+test, a ready-to-install
# tarball of the aggregate package, and a GitHub Release whose notes are the
# matching CHANGELOG entry. Cutting a release stays three manual steps —
# bump packages/kclaw/package.json, update CHANGELOG.md, push the v* tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Gate 1: the tag must match the single version source of truth, and
      # CHANGELOG.md must carry an entry for it — fail loudly before any
      # build time is spent.
      - name: Assert tag / package.json / CHANGELOG consistency
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/kclaw/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != packages/kclaw/package.json version $PKG" >&2
            exit 1
          fi
          if ! grep -q "^## \[$TAG\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $TAG" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Same ordering constraint as ci.yml: core's dist must exist before the
      # other packages typecheck.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # The tarball is the aggregate package with its assembled app/ and
      # WITHOUT node_modules (workspace links — `npm i -g ./kclaw` resolves
      # them from the registry on install).
      - name: Pack the aggregate package
        run: |
          tar --exclude='node_modules' -czf "kclaw-${GITHUB_REF_NAME}.tar.gz" -C packages kclaw
          tar -tzf "kclaw-${GITHUB_REF_NAME}.tar.gz" | grep -q '^kclaw/app/cli/cli.js$'
      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Entry headings carry a date suffix ("## [0.3.0] - 2026-09-19"),
          # so match the heading as a prefix and stop at the next heading.
          awk -v tag="## [$TAG]" '
            index($0, tag) == 1 { in_entry = 1; next }
            in_entry && /^## \[/ { exit }
            in_entry { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          test -s notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "kclaw $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "kclaw-${GITHUB_REF_NAME}.tar.gz"
