<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="description" content="kclaw — 本地常驻个人 agent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>kclaw</title>
    <script>
      // Set the theme before the stylesheet loads so the first paint is
      // always the right one (phantom is the default when nothing stored).
      try {
        var t = localStorage.getItem("kclaw_theme")
        document.documentElement.dataset.theme = t === "amber" ? "amber" : "phantom"
      } catch (e) {
        document.documentElement.dataset.theme = "phantom"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
