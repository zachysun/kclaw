<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="description" content="kclaw — 本地常驻个人 agent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>kclaw</title>
    <script>
      // Apply the stored theme before the stylesheet loads so the first paint
      // is always the right one. The stored value is applied as-is — the theme
      // list lives in the stylesheets (one file per theme), so this script
      // never changes when themes are added. An unknown value matches no theme
      // block and renders the default palette via the default theme's :root
      // until the app applies a validated choice on mount.
      try {
        var t = localStorage.getItem("kclaw_theme")
        document.documentElement.dataset.theme = t || "phantom"
      } catch (e) {
        document.documentElement.dataset.theme = "phantom"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
